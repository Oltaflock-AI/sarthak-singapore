name: Zoho lead sync

# Pulls Singapore Miracle leads that human callers couldn't reach
# (Lead_Status = "Not Answer") from Zoho CRM into the dialer queue. Idempotent —
# only newly-flagged leads are added (deduped by phone). The dialer then calls
# them on the no-pickup cadence: day 1, 3, 5, 7, 15, 30, then stops. Read-only
# on Zoho (no write-back).
#
# It's a full ~30k-lead scan, so it runs a few times a day — NOT every few
# minutes like the dialer tick. This cadence is unrelated to the 1/3/5/7/15/30
# retry cadence (that's per-lead, handled by the dialer).
#
# The voice line is auto-discovered (the number assigned to the Sarthak agent in
# ElevenLabs) — no config needed. Override with ZOHO_SYNC_AGENT_PHONE_NUMBER_ID
# in Vercel only if you ever need to force a specific line.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   CRON_SECRET = same value as in Vercel
#   Variables: APP_URL     = https://sarthak-singapore.vercel.app

on:
  # Resumed 2026-07-06 — new ElevenLabs account live.
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # manual trigger — use this for the first backfill

concurrency:
  group: zoho-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify config
        run: |
          test -n "${{ secrets.CRON_SECRET }}" || { echo "::error::CRON_SECRET secret is not set"; exit 1; }
          test -n "${{ vars.APP_URL }}"        || { echo "::error::APP_URL variable is not set"; exit 1; }

      - name: Trigger Zoho sync
        run: |
          curl -fsS --max-time 290 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/zoho/sync"
